# FigurePlan — 交底附图选用与排序合同

用于实用新型 / 外观设计交底：在成文前固化「贴哪些图、图序、为何选用、**图与图如何关联**」。  
与 StructureSchema / AppearanceSchema **配套**；成文与迭代**只读本清单**中 `use_in_disclosure: true` 的条目，勿再扫全 `assets/` 临场挑图。

落盘约定（交底）：案件工作目录 **`figure_plan.yaml`**（或等价 `figure_plan.json`），与 `structure_schema.*` / `appearance_schema.*` 同级（常见 `outputs/{案件标识}/`）。

```yaml
$schema: figure_plan
version: 1
patent_type: utility_model   # utility_model | design
theme_summary: ""            # 当前交底主题一句话；主题变了须重评本清单
schema_ref: ""               # 相对路径，如 structure_schema.yaml / appearance_schema.json
updated_at: ""               # 可选，ISO 本地时间
figures:
  - fig: 1                   # 交底「如图 N」；不入文则为 null
    role: assembly           # 见下方枚举
    path: ""                 # 相对案件根或 knowledge 的路径
    covers: []               # 实用新型：parts.id；外观：views.name 或要点短标签
    kind: lineart            # lineart | cad | photo_clean | photo_scene | other
    score: 0                 # 0–100；同批内越高越优先入文
    use_in_disclosure: true
    reason: ""               # 选用或剔除的一句话
    relates_to: []           # 可选；图际关联，见下
  - fig: 2
    role: detail
    path: ""
    covers: []
    kind: lineart
    score: 0
    use_in_disclosure: true
    reason: ""
    relates_to:
      - fig: 1                 # 指向本清单中另一条的 fig 号
        relation: detail_of    # 见下方枚举
        note: ""               # 可选短注，如「图1卡扣局部放大」
```

## `role` 枚举

| role | 实用新型 | 外观 |
|------|----------|------|
| `assembly` | 总装/装配关系 | — |
| `detail` | 局部（卡扣、缺口等） | 造型局部 |
| `ortho` | 正交/投影结构图 | 六视中的正投影 |
| `perspective` | 立体结构示意 | 立体图 |
| `reference` | 仅参考、默认不入正文 | 场景/包装等参考 |
| `rejected` | 明确不入文 | 同左 |

## `relates_to[].relation` 枚举

多图联读时填写；**机械/实用新型**有总装+局部时**强烈建议**写清。

| relation | 含义 | 典型用法 |
|----------|------|----------|
| `detail_of` | 本图是目标图的局部放大/细节 | 卡扣局部 ← 总装 |
| `section_of` | 本图是目标图的剖视/断面 | 装配剖 ← 立体总装 |
| `exploded_of` | 本图是目标图的爆炸/分解 | 爆炸图 ← 装配图 |
| `same_state` | 同一产品状态、不同角度 | 外观多视互指 |
| `alternate_view` | 另一投影/视角（非放大关系） | 主视 ↔ 俯视、立体 ↔ 正交 |
| `sequence` | 使用/拆装步骤前后图 | 步骤图 1→2 |

约定：

- `relates_to[].fig` 必须是本清单中**已分配**的 `fig`（入文图）；勿指向 `null`。  
- 局部图 `role: detail` 对总装 `assembly`：**至少一条** `detail_of`（或 `section_of` / `exploded_of`）。  
- 外观多视：可用 `same_state` / `alternate_view` 互链；场景参考图可不写。  
- 成文时：「如图 N…如图 M 为其局部…」须与 `relates_to` 一致。

## 排序启发式（填表时打分）

**实用新型（高→低）**

1. `lineart` / `cad` + `assembly` 或关键 `detail`，且 `covers` 命中保护相关件号  
2. `photo_clean` 结构照 / 局部 crop  
3. `photo_scene` / 与主题无关 → `use_in_disclosure: false`，`role: rejected` 或 `reference`

**外观（高→低）**

1. 产品区清晰的 `perspective` / `ortho`（`photo_clean` 或线稿均可）  
2. 造型 `detail`  
3. 重场景、广告包装 → 默认 `reference` 或不入文；缺正式六视时在 AppearanceSchema `uncertain` 标明

## 跨图核对（填表强制）

1. 同一 `parts.id` / 设计要点若出现在多张图，各图 `covers` 均应列入。  
2. 局部图与总装图的件号命名须一致（禁止图1叫「卡扣臂」、图2另起「弹片」且无映射）。  
3. 有 `assembly`+`detail` 入文对时，detail 侧须有 `relates_to`。  
4. 联读后仍对不上的写入 Structure/Appearance 的 `uncertain`，勿静默忽略。

## 必填

- `patent_type`、`theme_summary`、`figures`（可空数组，但空则须在 schema `uncertain` 说明无可用图）  
- 每条：`path`、`role`、`kind`、`score`、`use_in_disclosure`、`reason`  
- 凡 `use_in_disclosure: true` 须有唯一正整数 `fig`（从 1 连续编号为佳）  
- `relates_to` 可空数组；满足「总装+局部」条件时不得空置（见上）

## 多轮同步（强制）

下列任一发生时，**先更新本文件再改交底正文附图**（**无文件则新建，禁止跳过**）：

- 新增 / 删除 / 替换原材料图  
- 用户调整专利主题、保护侧重点或选定候选点  
- 部件表 / 设计要点变更导致 `covers` 失效  
- 图际关系变化（如新增局部图、拆分总装）→ 同步改 `relates_to`

更新动作：重评 `score` / `use_in_disclosure` / `fig` 序号 / `relates_to`，改写 `theme_summary` 与 `reason`；已剔除图保留条目并设 `use_in_disclosure: false`（便于审计），勿默默丢路径；被删图若仍被 `relates_to` 引用须改写或清除。

## 外观辅助线稿（可选）

用户确认开启后，由 `design_lineart_assist.md` 生成的 AI 线稿建议追加为 `kind: lineart`、`use_in_disclosure: false`、`reason` 含「AI 辅助线稿（非申报终稿）」，并用 `relates_to` 链回源实拍/参考图。详见 `references/schemas/design_lineart_brief.schema.yaml`。
